<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Quizzes - Center JUST</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #050914, #063b73, #0c8fa8);
            color: white;
            text-align: center;
        }

        h1 {
            padding-top: 70px;
            font-size: 42px;
            margin-bottom: 10px;
        }

        p {
            font-size: 20px;
            margin-bottom: 50px;
        }

        .quizzes {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 25px;
        }

        .quiz {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 280px;
            height: 130px;
            background: white;
            color: #123b6d;
            text-decoration: none;
            font-size: 28px;
            font-weight: bold;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.25);
            transition: 0.3s;
        }

        .quiz:hover {
            transform: translateY(-5px);
        }
    </style>
</head>

<body>

    <h1>AI</h1>
    <p>Quizzes</p>

    <div class="quizzes">
        <a class="quiz" href="quiz-1/">
            Quiz 1
        </a>
    </div>

</body>
</html>
