<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Quiz 2 | Center JUST</title>
<style>
:root{
  --navy:#0a1020;
  --navy2:#111a33;
  --parch:#f6efdc;
  --parch2:#ece1c4;
  --ink:#1c2233;
  --gold:#c9a24a;
  --gold2:#e6c878;
  --blue:#1f4fc4;
  --blue-bg:#dbe6ff;
  --red:#c42a2a;
  --red-bg:#fbdcdc;
  --serif:"Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  font-family:var(--serif);
  color:var(--parch);
  background:
    radial-gradient(ellipse at 50% -10%,#1b2a52 0%,transparent 60%),
    radial-gradient(ellipse at 50% 120%,#18213f 0%,transparent 55%),
    var(--navy);
  background-attachment:fixed;
  display:flex;justify-content:center;align-items:flex-start;
  padding:24px 14px 40px;
}
.app{width:100%;max-width:760px}
.screen{display:none}
.screen.active{display:block;animation:rise .45s ease both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.logo{
  width:150px;height:150px;border-radius:50%;object-fit:cover;display:block;margin:0 auto;
  border:3px solid var(--gold);box-shadow:0 0 0 6px rgba(201,162,74,.15),0 10px 30px rgba(0,0,0,.55);
  background:#000;
}
.logo.small{width:62px;height:62px;border-width:2px;box-shadow:0 4px 12px rgba(0,0,0,.5);margin:0}
.brand{text-align:center;margin-top:12px;font-size:1.35rem;letter-spacing:.14em;color:var(--gold2);font-weight:bold}

/* Intro */
.intro{text-align:center;padding:26px 8px}
.intro h1{
  font-size:clamp(2.4rem,9vw,3.8rem);margin-top:22px;line-height:1.05;
  color:var(--parch);letter-spacing:.02em;
  text-shadow:0 2px 0 #000,0 0 28px rgba(201,162,74,.28);
}
.rule{width:120px;height:3px;margin:18px auto;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.sub{font-size:1.15rem;line-height:1.55;color:#d8cfb6;max-width:30em;margin:0 auto}
.facts{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:26px 0 30px}
.fact{
  min-width:104px;padding:12px 16px;border:1px solid rgba(201,162,74,.55);border-radius:12px;
  background:rgba(255,255,255,.04);
}
.fact b{display:block;font-size:1.9rem;color:var(--gold2)}
.fact span{font-size:.92rem;color:#cfc6ab}

.btn{
  font-family:var(--serif);font-size:1.15rem;font-weight:bold;cursor:pointer;
  min-height:54px;padding:14px 34px;border-radius:999px;border:2px solid var(--gold);
  background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1a1405;
  box-shadow:0 6px 18px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.5);
  transition:transform .15s,box-shadow .15s,filter .15s;
}
.btn:hover{transform:translateY(-2px);filter:brightness(1.06)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible,.opt:focus-visible{outline:3px solid #fff;outline-offset:3px}
.btn.ghost{background:transparent;color:var(--gold2)}

/* Header */
.top{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.top .name{font-size:1.1rem;letter-spacing:.12em;color:var(--gold2);font-weight:bold}
.top .ttl{font-size:.9rem;color:#b9b19a}
.stats{margin-left:auto;text-align:right}
.stats .score{font-size:1.1rem;color:var(--parch)}
.stats .score b{color:var(--gold2);font-size:1.35rem}
.stats .streak{font-size:.85rem;color:#b9b19a;min-height:1.1em}
.meter{height:9px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden;margin-bottom:8px;border:1px solid rgba(201,162,74,.35)}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .5s ease}
.qcount{font-size:1rem;color:#cfc6ab;margin-bottom:14px}

/* Card */
.card{
  background:linear-gradient(180deg,var(--parch),var(--parch2));
  color:var(--ink);border-radius:16px;padding:26px 24px;
  border:2px solid var(--gold);
  box-shadow:0 0 0 5px rgba(201,162,74,.12),0 18px 40px rgba(0,0,0,.55);
}
.tag{display:inline-block;font-size:.85rem;padding:3px 12px;border-radius:999px;border:1px solid #8b7435;color:#6a5522;margin-bottom:14px;background:rgba(201,162,74,.18)}
.q{font-size:clamp(1.2rem,4.4vw,1.5rem);line-height:1.45;margin-bottom:20px}
.opts{display:grid;gap:11px}
.opt{
  display:flex;align-items:center;gap:14px;text-align:left;width:100%;
  min-height:58px;padding:12px 16px;border-radius:12px;cursor:pointer;
  font-family:var(--serif);font-size:1.07rem;line-height:1.35;color:var(--ink);
  background:#fffaf0;border:2px solid #cdbf94;
  transition:transform .15s,border-color .15s,background .15s,box-shadow .15s;
}
.opt .k{
  flex:0 0 auto;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;
  font-weight:bold;background:#e9dcb4;border:1px solid #a08a45;color:#4a3a10;
}
.opt:hover:not(:disabled){transform:translateX(5px);border-color:var(--gold);box-shadow:0 4px 12px rgba(0,0,0,.18)}
.opt:disabled{cursor:default}
.opt.tf{justify-content:center;font-size:1.25rem;font-weight:bold;min-height:66px}
.opts.two{grid-template-columns:1fr 1fr}
.opt.correct{background:var(--blue-bg);border-color:var(--blue);box-shadow:0 0 0 3px rgba(31,79,196,.2)}
.opt.correct .k{background:var(--blue);color:#fff;border-color:var(--blue)}
.opt.wrong{background:var(--red-bg);border-color:var(--red);box-shadow:0 0 0 3px rgba(196,42,42,.18);animation:shake .4s}
.opt.wrong .k{background:var(--red);color:#fff;border-color:var(--red)}
.opt.dim{opacity:.55}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.opt.correct.pop{animation:pop .45s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.035)}100%{transform:scale(1)}}

.fb{display:none;margin-top:18px;padding:15px 16px;border-radius:12px;border-left:6px solid;line-height:1.5}
.fb.show{display:block;animation:rise .35s both}
.fb.good{background:var(--blue-bg);border-color:var(--blue);color:#12297a}
.fb.bad{background:var(--red-bg);border-color:var(--red);color:#7a1313}
.fb strong{display:block;font-size:1.15rem;margin-bottom:4px}
.nextrow{display:none;margin-top:20px;text-align:right}
.nextrow.show{display:block}

/* Results */
.res{text-align:center;padding:10px 4px}
.ring{
  --p:0;width:190px;height:190px;border-radius:50%;margin:22px auto 8px;display:grid;place-items:center;
  background:conic-gradient(var(--gold2) calc(var(--p)*1%),rgba(255,255,255,.1) 0);
  box-shadow:0 0 30px rgba(201,162,74,.25);
}
.ring div{width:156px;height:156px;border-radius:50%;background:var(--navy2);display:grid;place-items:center;border:1px solid rgba(201,162,74,.4)}
.ring b{font-size:2.6rem;color:var(--gold2);line-height:1}
.ring small{display:block;font-size:1rem;color:#cfc6ab;margin-top:4px}
.res h2{font-size:1.9rem;margin:10px 0 6px}
.res p{color:#d8cfb6;font-size:1.1rem;max-width:30em;margin:0 auto 24px;line-height:1.5}
.pct{font-size:1.15rem;color:var(--gold2);margin-bottom:6px}

@media (max-width:520px){
  body{padding:14px 10px 30px}
  .card{padding:20px 15px}
  .opts.two{grid-template-columns:1fr}
  .logo{width:120px;height:120px}
  .top .ttl{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

      <div class="ring" id="ring"><div><span><b id="rScore"></b><small id="rOf"></small></span></div></div>
      <div class="pct" id="rPct"></div>
      <p id="rMsg"></p>
      <button class="btn" id="restartBtn">Restart the Quiz</button>
    </div>
  </section>

</div>

<script>
(function(){
  "use strict";

  var QUESTIONS = [
    // ---------- TRUE / FALSE ----------
    {type:"tf", q:"Artificial Narrow Intelligence (ANI) is designed to perform one specific task within a limited scope.", answer:true,
     exp:"ANI is specialized for a particular task."},
    {type:"tf", q:"Artificial General Intelligence (AGI) can apply knowledge and experience across different domains at a human level.", answer:true,
     exp:"AGI is described as capable of transferring intelligence across diverse domains."},
    {type:"tf", q:"Artificial Super Intelligence (ASI) currently exists and is widely used in real-world applications.", answer:false,
     exp:"ASI remains hypothetical and does not exist in the real world today."},
    {type:"tf", q:"All AI systems currently in existence belong to the Narrow AI category.", answer:true,
     exp:"Every AI system that exists today is Narrow AI; true AGI and ASI have not been achieved."},
    {type:"tf", q:"ChatGPT is classified as Artificial General Intelligence because it can generate text, images, and code.", answer:false,
     exp:"ChatGPT is classified as Narrow AI, despite its varied outputs."},
    {type:"tf", q:"Reactive AI systems can store memories of previous experiences and learn from them.", answer:false,
     exp:"Reactive AI has no memory of previous experiences."},
    {type:"tf", q:"IBM's Deep Blue defeated chess world champion Garry Kasparov in 1997.", answer:true,
     exp:"Deep Blue defeated Kasparov in 1997."},
    {type:"tf", q:"Limited Memory AI uses past information and real-time inputs to inform immediate decisions.", answer:true,
     exp:"Its memory is temporary and limited, but it still draws on past information and current inputs."},
    {type:"tf", q:"Theory of Mind AI can understand human emotions, beliefs, and intentions, and it currently exists as a fully developed technology.", answer:false,
     exp:"Theory of Mind AI remains theoretical and does not currently exist."},
    {type:"tf", q:"Rule-Based Systems operate according to predefined conditional rules, such as \u201CIF a condition occurs, THEN execute an action.\u201D", answer:true,
     exp:"Rule-based systems follow predefined conditional logic."},
    {type:"tf", q:"A rule-based AI system has complete freedom to ignore the parameters set by its programmer.", answer:false,
     exp:"These systems execute the parameters defined by their developers or operators."},
    {type:"tf", q:"Machine Learning systems identify patterns in training data and generate predictions.", answer:true,
     exp:"ML systems learn patterns from data to produce predictions."},
    {type:"tf", q:"In supervised learning, humans label the training data and may review the system's classifications.", answer:true,
     exp:"Supervised learning uses labelled examples and human oversight."},
    {type:"tf", q:"Unsupervised learning requires all training data to be labelled by humans before the system can process it.", answer:false,
     exp:"Unsupervised learning processes unlabelled data without human guidance."},
    {type:"tf", q:"Hybrid AI systems combine different technical architectures, such as rule-based systems and deep learning.", answer:true,
     exp:"Hybrid systems integrate multiple AI architectures."},

    // ---------- MULTIPLE CHOICE ----------
    {type:"mc", q:"Which classification divides AI systems according to what they are capable of doing?",
     options:["Classification according to functionality","Classification according to capability","Classification according to technical model","Classification according to legal liability"], answer:1,
     exp:"Classification by capability focuses on what the AI system can do."},
    {type:"mc", q:"Which of the following is an example of Artificial Narrow Intelligence (ANI)?",
     options:["A machine with intelligence exceeding humans in every field","A machine capable of learning any human activity independently","A virtual assistant such as Siri","A machine possessing complete human-like general intelligence"], answer:2,
     exp:"Siri is an example of specialized AI."},
    {type:"mc", q:"What is the current status of Artificial General Intelligence (AGI)?",
     options:["It is widely used in commercial legal systems.","It exists in all modern AI applications.","It has replaced Narrow AI.","It does not yet exist as true AGI."], answer:3,
     exp:"True AGI does not yet exist."},
    {type:"mc", q:"Why is ChatGPT classified as Narrow AI?",
     options:["It can only perform mathematical calculations.","Its core function is generating content from data, despite its different outputs.","It cannot generate text or images.","It operates exclusively through fixed \u201CIF/THEN\u201D rules."], answer:1,
     exp:"Its different outputs (text, images, code) are all forms of content generation."},
    {type:"mc", q:"Which type of AI responds only to current inputs without remembering previous experiences?",
     options:["Limited Memory AI","Theory of Mind AI","Reactive AI","Self-Aware AI"], answer:2,
     exp:"Reactive AI responds to present situations without memory."},
    {type:"mc", q:"What happened in 1997 involving IBM's Deep Blue?",
     options:["It defeated Garry Kasparov in chess.","It developed self-awareness.","It became an example of AGI.","It invented machine learning."], answer:0,
     exp:"Deep Blue defeated Garry Kasparov in 1997."},
    {type:"mc", q:"Which type of AI is theoretically capable of understanding human emotions, beliefs, and intentions?",
     options:["Reactive AI","Rule-Based AI","Limited Memory AI","Theory of Mind AI"], answer:3,
     exp:"Theory of Mind AI is intended to understand human mental states."},
    {type:"mc", q:"Which of the following best describes a Rule-Based System?",
     options:["It discovers patterns from unlabelled data.","It follows predefined conditional rules.","It learns exclusively through rewards and penalties.","It uses human emotions to make decisions."], answer:1,
     exp:"Rule-based systems follow predefined conditional logic."},
    {type:"mc", q:"A bank's rule-based system is programmed with a monthly income threshold of EGP 5,000. What happens when an applicant's monthly income is below that threshold?",
     options:["The system automatically approves the loan.","The system asks the applicant to train the model.","The system automatically rejects the application.","The system ignores the income information."], answer:2,
     exp:"The system simply follows its programmed rejection rule."},
    {type:"mc", q:"How do Machine Learning systems differ from traditional Rule-Based Systems?",
     options:["They identify patterns in training data and generate predictions.","They cannot process large amounts of data.","They always require a separate fixed rule for every possible input.","They operate without processing information."], answer:0,
     exp:"Machine Learning identifies patterns and makes predictions from data instead of relying on fixed rules."},
    {type:"mc", q:"Which form of Machine Learning uses human-labelled examples and supervision?",
     options:["Unsupervised Learning","Reinforcement Learning","Deep Learning only","Supervised Learning"], answer:3,
     exp:"Supervised Learning uses labelled examples and human oversight."},
    {type:"mc", q:"Which form of Machine Learning identifies clusters and common patterns in unlabelled data?",
     options:["Supervised Learning","Unsupervised Learning","Rule-Based Processing","Reactive Processing"], answer:1,
     exp:"Unsupervised Learning identifies structures in unlabelled data."},
    {type:"mc", q:"In Reinforcement Learning, what happens when the model takes an action that supports its target objective?",
     options:["It receives a digital reward.","It loses all its training data.","It automatically becomes self-aware.","It stops processing further inputs."], answer:0,
     exp:"A reward encourages actions aligned with the target objective."},
    {type:"mc", q:"Deep Learning primarily uses which technical architecture?",
     options:["Fixed conditional statements only","A single unchanging decision rule","Multilayered Artificial Neural Networks","Human-labelled databases without computational layers"], answer:2,
     exp:"Deep Learning uses multilayered artificial neural networks."},
    {type:"mc", q:"What is a major legal challenge associated with Hybrid AI Systems?",
     options:["They cannot combine different AI architectures.","They are incapable of improving functional safety.","They operate without any rules or constraints.","It can be difficult to determine whether an accident resulted from a fixed rule or a deep-learning failure."], answer:3,
     exp:"With combined architectures, it can be hard to identify the source of a failure."}
  ];

  var LETTERS = ["A","B","C","D"];
  var $ = function(id){return document.getElementById(id)};
  var order = [], idx = 0, score = 0, streak = 0, locked = false;

  function show(id){
    ["start","quiz","results"].forEach(function(s){$(s).classList.toggle("active", s===id)});
    window.scrollTo(0,0);
  }
  function shuffle(a){
    for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}
    return a;
  }

  // Intro counts come from the real question array
  var tfCount = QUESTIONS.filter(function(q){return q.type==="tf"}).length;
  $("nTotal").textContent = QUESTIONS.length;
  $("nTF").textContent = tfCount;
  $("nMC").textContent = QUESTIONS.length - tfCount;

  function begin(){
    order = shuffle(QUESTIONS.map(function(_,i){return i}));
    idx = 0; score = 0; streak = 0;
    $("scoreNow").textContent = "0";
    show("quiz");
    render();
  }

  function render(){
    locked = false;
    var q = QUESTIONS[order[idx]];
    var total = order.length;
    $("qcount").textContent = "Question " + (idx+1) + " of " + total;
    $("bar").style.width = (idx/total*100) + "%";
    $("tag").textContent = q.type==="tf" ? "True or False" : "Multiple Choice";
    $("qtext").textContent = q.q;
    $("streak").textContent = streak>=2 ? ("\uD83D\uDD25 " + streak + " in a row") : "";
    var box = $("opts");
    box.innerHTML = "";
    box.className = "opts" + (q.type==="tf" ? " two" : "");
    var fb = $("fb"); fb.className = "fb"; fb.innerHTML = "";
    $("nextrow").classList.remove("show");
    $("nextBtn").textContent = (idx===total-1) ? "See my result" : "Next question";

    if(q.type==="tf"){
      [["True",true],["False",false]].forEach(function(p){
        var b = document.createElement("button");
        b.type="button"; b.className="opt tf"; b.textContent=p[0];
        b.addEventListener("click", function(){answer(p[1]===q.answer, b)});
        b._correct = (p[1]===q.answer);
        box.appendChild(b);
      });
    } else {
      q.options.forEach(function(t,i){
        var b = document.createElement("button");
        b.type="button"; b.className="opt";
        var k = document.createElement("span"); k.className="k"; k.textContent = LETTERS[i];
        var s = document.createElement("span"); s.textContent = t;
        b.appendChild(k); b.appendChild(s);
        b._correct = (i===q.answer);
        b.addEventListener("click", function(){answer(i===q.answer, b)});
        box.appendChild(b);
      });
    }
  }

  function answer(isRight, btn){
    if(locked) return;
    locked = true;
    var q = QUESTIONS[order[idx]];
    var btns = $("opts").children;
    for(var i=0;i<btns.length;i++){
      var b = btns[i];
      b.disabled = true;
      if(b._correct){ b.classList.add("correct"); if(b===btn) b.classList.add("pop"); }
      else if(b===btn){ b.classList.add("wrong"); }
      else { b.classList.add("dim"); }
    }
    if(isRight){ score++; streak++; } else { streak = 0; }
    $("scoreNow").textContent = score;
    $("streak").textContent = streak>=2 ? ("\uD83D\uDD25 " + streak + " in a row") : "";
    $("bar").style.width = ((idx+1)/order.length*100) + "%";

    var fb = $("fb");
    fb.className = "fb show " + (isRight ? "good" : "bad");
    fb.innerHTML = "";
    var h = document.createElement("strong");
    h.textContent = isRight ? "Correct!" : "Incorrect.";
    var p = document.createElement("span");
    p.textContent = q.exp;
    fb.appendChild(h); fb.appendChild(p);
    $("nextrow").classList.add("show");
    $("nextBtn").focus({preventScroll:false});
  }

  function next(){
    if(idx < order.length-1){ idx++; render(); }
    else { finish(); }
  }

  function finish(){
    var total = order.length;
    var pct = Math.round(score/total*100);
    var title, msg;
    if(pct>=90){title="Outstanding!"; msg="Excellent command of the material. You are ready to move on.";}
    else if(pct>=75){title="Well done!"; msg="A strong result. A quick review of the missed items will make it perfect.";}
    else if(pct>=50){title="Good effort"; msg="You have a solid base. Restart the quiz and aim higher.";}
    else {title="Keep practising"; msg="Review the topics and try again. Every attempt reshuffles the questions.";}
    $("rTitle").textContent = title;
    $("rScore").textContent = score + " / " + total;
    $("rOf").textContent = "correct answers";
    $("rPct").textContent = pct + "%";
    $("rMsg").textContent = msg;
    show("results");
    var ring = $("ring"), cur = 0;
    ring.style.setProperty("--p", 0);
    var t = setInterval(function(){
      cur += 2;
      if(cur >= pct){ cur = pct; clearInterval(t); }
      ring.style.setProperty("--p", cur);
    }, 18);
  }

  $("startBtn").addEventListener("click", begin);
  $("nextBtn").addEventListener("click", next);
  $("restartBtn").addEventListener("click", begin);
})();
</script>
</body>
</html>
