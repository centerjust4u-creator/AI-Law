<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Quiz 1 | Center JUST</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:"Segoe UI",Tahoma,Arial,sans-serif;color:#1c2540;background:radial-gradient(circle at 15% 10%,#2a1b6e 0,transparent 40%),radial-gradient(circle at 85% 90%,#0b6b5c 0,transparent 40%),#0a1230;display:flex;justify-content:center;padding:16px}
.wrap{width:100%;max-width:720px}
.screen{display:none;animation:pop .45s ease}
.screen.on{display:block}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
.brand{text-align:center;margin:8px 0 14px}
.brand img{width:120px;height:120px;border-radius:50%;box-shadow:0 0 0 4px #d4a843,0 0 30px rgba(212,168,67,.5);animation:float 3s ease-in-out infinite}
.brand b{display:block;margin-top:10px;font-family:Georgia,serif;font-size:1.5rem;letter-spacing:2px;background:linear-gradient(90deg,#ffd76a,#ff8fb1,#7fd8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes float{50%{transform:translateY(-6px)}}
.card{background:linear-gradient(160deg,#fff8e6,#f6ead0);border:3px solid #d4a843;border-radius:20px;padding:24px;box-shadow:0 14px 40px rgba(0,0,0,.45)}
h1{font-family:Georgia,serif;text-align:center;font-size:2.2rem;background:linear-gradient(90deg,#e8446d,#f59e0b,#12a37f,#3b6ef5);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{text-align:center;margin:10px 0 16px;color:#4a5272;font-size:1.05rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:20px}
.chip{padding:7px 14px;border-radius:99px;color:#fff;font-weight:700;font-size:.9rem}
.c1{background:#e8446d}.c2{background:#12a37f}.c3{background:#3b6ef5}
.btn{display:block;width:100%;border:0;cursor:pointer;padding:16px;border-radius:14px;font-size:1.15rem;font-weight:800;color:#fff;background:linear-gradient(90deg,#7c3aed,#e8446d,#f59e0b);background-size:200%;transition:.3s;box-shadow:0 6px 16px rgba(124,58,237,.4)}
.btn:hover{background-position:100%;transform:translateY(-2px)}
.top{display:flex;justify-content:space-between;align-items:center;color:#ffe9a8;font-weight:700;margin-bottom:8px;gap:8px;flex-wrap:wrap}
.pill{background:rgba(255,255,255,.12);padding:6px 14px;border-radius:99px}
.bar{height:10px;background:rgba(255,255,255,.15);border-radius:9px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#12a37f,#3b6ef5,#e8446d,#f59e0b);transition:width .4s}
.tag{display:inline-block;padding:4px 12px;border-radius:99px;font-size:.78rem;font-weight:800;color:#fff;margin-bottom:10px}
.q{font-family:Georgia,serif;font-size:1.3rem;line-height:1.5;margin-bottom:16px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;margin-bottom:10px;border-radius:14px;border:2px solid #d9c48d;background:#fff;font-size:1.05rem;color:#1c2540;cursor:pointer;min-height:54px;transition:.2s}
.opt:hover:not(:disabled){transform:translateX(5px);border-color:#7c3aed;background:#f3ecff}
.opt .l{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff}
.opt:nth-child(1) .l{background:#e8446d}.opt:nth-child(2) .l{background:#f59e0b}.opt:nth-child(3) .l{background:#12a37f}.opt:nth-child(4) .l{background:#3b6ef5}
.opt.ok{background:#dbe8ff;border-color:#1f55d6;color:#0c2f7a;font-weight:700}
.opt.no{background:#ffdede;border-color:#d62839;color:#8a0f1c;font-weight:700;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.fb{display:none;margin:6px 0 14px;padding:14px;border-radius:12px;line-height:1.5}
.fb.good{display:block;background:#dbe8ff;border-left:6px solid #1f55d6;color:#0c2f7a}
.fb.bad{display:block;background:#ffdede;border-left:6px solid #d62839;color:#8a0f1c}
.fb b{display:block;font-size:1.1rem;margin-bottom:4px}
#next{display:none}
.big{font-family:Georgia,serif;font-size:3.4rem;text-align:center;font-weight:800;background:linear-gradient(90deg,#e8446d,#f59e0b,#12a37f,#3b6ef5);-webkit-background-clip:text;background-clip:text;color:transparent;margin:6px 0}
.msg{text-align:center;font-size:1.15rem;margin-bottom:18px;color:#4a5272}
canvas{position:fixed;inset:0;pointer-events:none;z-index:9}
@media(max-width:480px){h1{font-size:1.7rem}.q{font-size:1.15rem}.card{padding:16px}}
</style>
</head>

<script>
var Q=[
{t:"tf",q:"Artificial Intelligence is a branch of computer science focused on creating systems capable of simulating human intelligence.",a:true,e:"AI aims to build machines that perform cognitive functions such as learning, reasoning, and problem-solving."},
{t:"tf",q:"There is a single, universally accepted definition of AI.",a:false,e:"No single definition exists, mainly because intelligence itself is a complex human characteristic."},
{t:"tf",q:"Every algorithm qualifies as Artificial Intelligence.",a:false,e:"Every AI system uses algorithms, but not every algorithm is AI. AI also involves learning and adaptation."},
{t:"tf",q:"A human child usually needs far more examples than a machine-learning system to learn to recognize a cat.",a:false,e:"Humans learn from very few examples, while machine learning needs tens of thousands of images."},
{t:"tf",q:"Under current law, an AI can be recognized as the author of a work.",a:false,e:"Current law requires an author to be a natural person, so AI cannot be an author."},
{t:"tf",q:"Many modern AI systems learn from data, although some rely on predefined rules.",a:true,e:"Learning from data is the central idea of many modern AI systems, but rule-based AI also exists."},
{t:"tf",q:"The term Artificial Intelligence was formally established at the 1956 Dartmouth Conference.",a:true,e:"AI was formally established at the 1956 Dartmouth Conference, led by John McCarthy."},
{t:"tf",q:"A standard non-AI robotic vacuum may simply stop when it meets an obstacle such as a piece of paper.",a:true,e:"A non-AI machine follows a programmed path, while an AI-enabled one learns to maneuver around obstacles."},
{t:"tf",q:"AI is objective regardless of the quality of the data it is given.",a:false,e:"AI is only as objective as its data: Garbage In, Garbage Out."},
{t:"tf",q:"Seeing a social media post resurface after 10 years shows that user data is stored permanently on company servers.",a:true,e:"It proves data is kept on servers, not just the local device, raising data-security and Right to be Forgotten concerns."},
{t:"tf",q:"A human judge can exercise mercy and understand the spirit of the law, qualities AI does not possess.",a:true,e:"AI applies the law mechanically, while a human judge can show mercy, as in the suspended sentence given to a starving man."},
{t:"tf",q:"Unlocking a phone with Face ID is an example of AI in everyday life.",a:true,e:"The system compares your face with stored data to recognize you, which is AI in action."},
{q:"Who is credited with coining the term Artificial Intelligence?",o:["Alan Turing","John McCarthy","Bill Gates","Elon Musk"],a:1,e:"John McCarthy led the 1956 Dartmouth Conference and coined the term."},
{q:"Which revolution shifted from passive data storage to systems that simulate human cognitive functions?",o:["The Industrial Revolution","The Digital Revolution","The AI Revolution","The Agricultural Revolution"],a:2,e:"The AI Revolution is the third major shift in human productivity."},
{q:"The Digital Revolution is best described as the shift to:",o:["Machine-based production","Computer-based storage","Systems that simulate cognition","Manual labor"],a:1,e:"Information held in huge libraries could be stored digitally on a single flash drive."},
{q:"In the four stages of how AI functions, which stage means drawing conclusions from data?",o:["Learning","Inference","Adaptation","Problem Solving"],a:1,e:"Inference (reasoning) draws conclusions from the data the system has ingested."},
{q:"What does the Adaptation stage of AI mean?",o:["Ingesting vast amounts of data","Adjusting behavior based on the environment","Deleting old data","Choosing a programming language"],a:1,e:"Adaptation is adjusting behavior according to the surrounding environment."},
{q:"In law, Legal Personality refers to the capacity to:",o:["Win every case","Hold rights and bear obligations","Serve as a judge","Invent new technology"],a:1,e:"It typically involves a name, domicile, nationality, and financial patrimony."},
{q:"Which country granted nationality to the robot Sophia?",o:["Japan","South Korea","Saudi Arabia","United States"],a:2,e:"Saudi Arabia granted nationality to the robot Sophia."},
{q:"Some scholars suggest giving AI a Juristic Personality similar to that of:",o:["A corporation","A minor child","A foreign tourist","A judge"],a:0,e:"Like a corporation, the robot would have a legal representative."},
{q:"Which comparison do other scholars use for AI personality?",o:["A tourist visa","Environmental personality granted to trees or rivers","A driving license","A trade union"],a:1,e:"Organizations may sue on behalf of trees or rivers if harmed, and a similar idea is proposed for AI."},
{q:"In the AI kidney-surgery scenario, who are possible candidates for liability after a surgical error?",o:["Only the surgeon","Only the software company","Only the importer","The surgeon, the software company, or the importer"],a:3,e:"The scenario raises all three: the supervising surgeon, the programmers, and the commercial importer."},

var $=function(i){return document.getElementById(i)};
var order,idx,score,locked;
var tf=Q.filter(function(x){return x.t==="tf"}).length;
$("cTot").textContent=Q.length+" Questions";
$("cTF").textContent=tf+" True/False";
$("cMC").textContent=(Q.length-tf)+" Multiple Choice";
function show(id){["intro","game","end"].forEach(function(s){$(s).classList.toggle("on",s===id)});window.scrollTo(0,0)}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function begin(){order=shuffle(Q);idx=0;score=0;show("game");render()}
function render(){
 var q=order[idx];locked=false;
 $("prog").textContent="Question "+(idx+1)+" of "+order.length;
 $("sc").textContent="Correct: "+score;
 $("bar").style.width=(idx/order.length*100)+"%";
 var tg=$("tag");tg.textContent=q.t==="tf"?"TRUE / FALSE":"MULTIPLE CHOICE";tg.style.background=q.t==="tf"?"#e8446d":"#7c3aed";
 $("q").textContent=q.q;
 var opts=q.t==="tf"?["True","False"]:q.o,box=$("opts");box.innerHTML="";
 opts.forEach(function(txt,i){
  var b=document.createElement("button");b.className="opt";
  var l=document.createElement("span");l.className="l";l.textContent=q.t==="tf"?(i?"F":"T"):"ABCD".charAt(i);
  var s=document.createElement("span");s.textContent=txt;
  b.appendChild(l);b.appendChild(s);
  b.onclick=function(){pick(i)};box.appendChild(b)});
 $("fb").className="fb";$("next").style.display="none";
 $("next").textContent=idx===order.length-1?"See my score":"Next question";
}
function pick(i){
 if(locked)return;locked=true;
 var q=order[idx],c=q.t==="tf"?(q.a?0:1):q.a,bs=document.querySelectorAll(".opt");
 bs.forEach(function(b){b.disabled=true});
 var good=i===c;
 if(good){score++;bs[i].classList.add("ok")}else{bs[i].classList.add("no");bs[c].classList.add("ok")}
 $("sc").textContent="Correct: "+score;
 var f=$("fb");f.className="fb "+(good?"good":"bad");
 f.innerHTML="";var h=document.createElement("b");h.textContent=good?"Correct!":"Incorrect";
 var p=document.createElement("span");p.textContent=q.e;f.appendChild(h);f.appendChild(p);
 $("next").style.display="block";
 if(good)burst(18);
}
function finish(){
 $("bar").style.width="100%";
 $("final").textContent=score+" / "+order.length;
 var r=score/order.length;
 $("msg").textContent=r>=.9?"Outstanding work!":r>=.7?"Great job!":r>=.5?"Good effort, keep practicing!":"Keep studying and try again!";
 show("end");if(r>=.5)burst(160);
}
$("start").onclick=begin;
$("restart").onclick=begin;
$("next").onclick=function(){idx++;if(idx>=order.length)finish();else render()};
var cv=$("cv"),cx=cv.getContext("2d"),ps=[],run=false;
function size(){cv.width=innerWidth;cv.height=innerHeight}size();addEventListener("resize",size);
function burst(n){
 var cols=["#e8446d","#f59e0b","#12a37f","#3b6ef5","#7c3aed","#ffd76a"];
 for(var i=0;i<n;i++)ps.push({x:innerWidth/2,y:innerHeight/3,vx:(Math.random()-.5)*14,vy:Math.random()*-12-2,s:Math.random()*7+4,c:cols[i%6],l:90});
 if(!run){run=true;tick()}
}
function tick(){
 cx.clearRect(0,0,cv.width,cv.height);
 ps=ps.filter(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.l--;cx.globalAlpha=Math.max(p.l/90,0);cx.fillStyle=p.c;cx.fillRect(p.x,p.y,p.s,p.s);return p.l>0});
 if(ps.length)requestAnimationFrame(tick);else{run=false;cx.clearRect(0,0,cv.width,cv.height)}
}
</script>
</body>
